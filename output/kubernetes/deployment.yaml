Below is the YAML configuration for deploying an Nginx application using Kubernetes. This example includes a `Deployment`, `Service`, and an `Ingress` resource, where the `Service` is set to expose the service as a `LoadBalancer`.

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  selector:
    app: nginx
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
spec:
  rules:
  - host: nginx.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
```

Replace `nginx.example.com` with your desired domain or use an FQDN that matches the one used to create a public load balancer.

Please note, for real-world production environments, you might need additional configurations like readiness and liveness probes for better application resilience. Also, ensure that services are properly secured (e.g., by using TLS and configuring certificate management) and follow best practices in Kubernetes deployment strategy and scaling policies.